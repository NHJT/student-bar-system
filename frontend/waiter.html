<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服務生｜學生酒吧</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>服務生</h1>
    <span id="ws-status" class="ws-status">連線中…</span>
  </header>

  <main class="layout-two-col">
    <!-- 點餐區：先把品項一項一項加進本次訂單，最後整張送出 -->
    <section class="panel">
      <h2>點餐</h2>
      <label class="field">桌號
        <select id="table-number" required></select>
      </label>

      <form id="add-item-form">
        <label class="field">飲料
          <select id="drink-select" required></select>
        </label>

        <div class="field">
          <span class="field-label">數量</span>
          <div class="stepper">
            <button type="button" class="stepper-btn" id="qty-minus"
                    aria-label="減少數量">−</button>
            <span class="stepper-value" id="quantity-value"
                  aria-live="polite">1</span>
            <button type="button" class="stepper-btn" id="qty-plus"
                    aria-label="增加數量">＋</button>
          </div>
        </div>

        <label class="field">特殊需求
          <input type="text" id="special-request" placeholder="例：少冰、去薄荷">
        </label>
        <button type="submit" class="btn btn-action btn-ghost">＋ 加入訂單</button>
      </form>

      <h2>本次訂單 <small id="cart-count" class="cart-count"></small></h2>
      <ul id="cart-list" class="cart-list">
        <li class="placeholder">還沒加入任何品項</li>
      </ul>
      <!-- 送出與清空放在清單右下角，離「加入訂單」夠遠，避免誤觸 -->
      <div class="cart-actions">
        <button id="cart-clear" class="btn btn-small btn-ghost" disabled>清空</button>
        <button id="cart-submit" class="btn btn-action btn-primary" disabled>送出訂單</button>
      </div>
    </section>

    <!-- 訂單與付款區（第三步實作） -->
    <section class="panel">
      <h2>本場訂單／付款</h2>
      <ul id="order-list" class="order-list">
        <li class="placeholder">尚無訂單</li>
      </ul>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/waiter.js"></script>
</body>
</html>
