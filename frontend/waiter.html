<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服務生｜學生酒吧</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>服務生</h1>
    <span>
      <span id="sound-hint" class="sound-hint">🔇 點畫面任一處以啟用警示音</span>
      <span id="ws-status" class="ws-status">連線中…</span>
    </span>
  </header>

  <!-- 版面：電腦左邊點餐，右邊上為待送達、下為本場訂單；
       手機單欄時待送達排最前面（DOM 順序就是手機順序，不靠 order 硬搬） -->
  <main class="waiter-layout">
    <!-- 待送達：吧台一按「完成」就會即時出現在這裡 -->
    <section class="panel deliver-panel" id="deliver-panel">
      <h2>
        🚚 待送達
        <span id="deliver-count" class="count-badge" hidden>0</span>
        <small>逾 10 分未送出</small>
      </h2>
      <ul id="queue-completed" class="order-queue"></ul>
    </section>

    <!-- 點餐區：先把品項一項一項加進本次訂單，最後整張送出 -->
    <section class="panel panel-order">
      <h2>點餐</h2>
      <label class="field">桌號
        <select id="table-number" required></select>
      </label>

      <form id="add-item-form">
        <!-- 兩段式選酒：先選基酒分類，飲料選單只列該分類的酒 -->
        <label class="field">基酒
          <select id="category-select" required></select>
        </label>
        <label class="field">飲料
          <select id="drink-select" required></select>
        </label>

        <label class="field">特殊需求
          <input type="text" id="special-request" placeholder="例：少冰、去薄荷">
        </label>
        <button type="submit" class="btn btn-action btn-primary">＋ 加入訂單</button>
      </form>

      <!-- 一杯酒就是一張訂單：購物車裡每一列送出後各自成為一張單 -->
      <h2>本次訂單 <small id="cart-count" class="cart-count"></small></h2>
      <ul id="cart-list" class="cart-list">
        <li class="placeholder">還沒加入任何品項</li>
      </ul>
      <!-- 送出與清空放在清單右下角，離「加入訂單」夠遠，避免誤觸 -->
      <div class="cart-actions">
        <button id="cart-clear" class="btn btn-small btn-ghost" disabled>清空</button>
        <button id="cart-submit" class="btn btn-action btn-primary" disabled>送出訂單</button>
      </div>
    </section>

    <!-- 訂單與付款區：重點是付款狀態，未付款排最上面，
         已付款且已送達的縮成一行，點一下才展開品項 -->
    <section class="panel panel-paylist">
      <h2>本場訂單／付款 <small id="unpaid-count" class="pay-count"></small></h2>
      <ul id="order-list" class="order-list compact">
        <li class="placeholder">尚無訂單</li>
      </ul>
    </section>

    <!-- 已完成／已送達：只列當日（?today=true），預設收合。
         送出去的單不會消失，可以回頭核對四個階段的時間，也能退回上一步。 -->
    <section class="panel done-panel">
      <h2>
        <button id="done-toggle" class="done-toggle" aria-expanded="false">
          <span id="done-caret">▸</span> ✅ 已完成／已送達
        </button>
        <span id="done-count" class="count-badge" hidden>0</span>
        <small>本日，新的在前</small>
      </h2>
      <ul id="queue-done" class="order-queue" hidden></ul>
    </section>
  </main>

  <!-- Andon 超時跳出視窗（待送達超過門檻時） -->
  <div id="andon-modal" class="modal-backdrop" hidden>
    <div class="modal" role="alertdialog" aria-labelledby="andon-modal-title">
      <h2 id="andon-modal-title">⚠️ 訂單超時未送達</h2>
      <ul id="andon-modal-body" class="alert-list"></ul>
      <button data-modal-close class="btn btn-primary">知道了</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/waiter.js"></script>
</body>
</html>
