<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吧台｜學生酒吧</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>🍸 吧台訂單佇列</h1>
    <span>
      <span id="sound-hint" class="sound-hint">🔇 點畫面任一處以啟用警示音</span>
      <span id="ws-status" class="ws-status">連線中…</span>
    </span>
  </header>

  <!-- 訂單佇列；Andon 超時門檻見 common.js。
       吧台只管到「完成製作」為止，送酒與待送達超時都歸服務生頁負責 -->
  <main class="layout-two-col">
    <section class="panel queue-col" data-status="new">
      <h2>🆕 新訂單 <small>逾 20 分未開始</small></h2>
      <ul id="queue-new" class="order-queue"></ul>
    </section>
    <section class="panel queue-col" data-status="preparing">
      <h2>🔧 製作中 <small>逾 10 分未完成</small></h2>
      <ul id="queue-preparing" class="order-queue"></ul>
    </section>
  </main>

  <!-- 已完成／已送達：只列當日（?today=true），預設收合。
       做完的單不再消失，吧台可以回頭核對，也能退回上一步。 -->
  <main class="layout-one-col">
    <section class="panel done-panel">
      <h2>
        <button id="done-toggle" class="done-toggle" aria-expanded="false">
          <span id="done-caret">▸</span> ✅ 已完成／已送達
        </button>
        <span id="done-count" class="count-badge" hidden>0</span>
        <small>本日，新的在前</small>
      </h2>
      <ul id="queue-done" class="order-queue" hidden></ul>
    </section>
  </main>

  <!-- Andon 超時跳出視窗 -->
  <div id="andon-modal" class="modal-backdrop" hidden>
    <div class="modal" role="alertdialog" aria-labelledby="andon-modal-title">
      <h2 id="andon-modal-title">⚠️ 訂單超時</h2>
      <ul id="andon-modal-body" class="alert-list"></ul>
      <button data-modal-close class="btn btn-primary">知道了</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/bar.js"></script>
</body>
</html>
